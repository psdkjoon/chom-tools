name: Build tools

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: "28.2.13676358"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tool: [stylua, ruff, biome, rust-analyzer]
        abi: [arm64-v8a, armeabi-v7a, x86_64]
        include:
          - tool: stylua
            repo: JohnnyMorganz/StyLua
            ref: v2.0.2
            version: 2.0.2
            crate_args: --features lua54
            bin: stylua
          - tool: ruff
            repo: astral-sh/ruff
            ref: 0.8.4
            version: 0.8.4
            crate_args: -p ruff
            bin: ruff
          - tool: biome
            repo: biomejs/biome
            ref: cli/v1.9.4
            version: 1.9.4
            crate_args: -p biome_cli
            bin: biome
          - tool: rust-analyzer
            repo: rust-lang/rust-analyzer
            ref: "2024-12-23"
            version: 2024-12-23
            crate_args: -p rust-analyzer
            bin: rust-analyzer
          - abi: arm64-v8a
            triple: aarch64-linux-android
          - abi: armeabi-v7a
            triple: armv7-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source
        run: git clone --depth 1 --branch "${{ matrix.ref }}" "https://github.com/${{ matrix.repo }}.git" src
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - run: cargo install cargo-ndk --locked
      - name: Add the Android target to the source toolchain
        working-directory: src
        run: rustup target add ${{ matrix.triple }}
      - name: Build
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          mkdir -p ../dist "$RUNNER_TEMP/libgcc"
          echo "INPUT(-lunwind)" > "$RUNNER_TEMP/libgcc/libgcc.a"
          export RUSTFLAGS="-L $RUNNER_TEMP/libgcc --cap-lints warn"
          cargo ndk -t ${{ matrix.abi }} --platform 24 build --release ${{ matrix.crate_args }}
          cp "target/${{ matrix.triple }}/release/${{ matrix.bin }}" "../dist/${{ matrix.tool }}-${{ matrix.version }}-${{ matrix.abi }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.tool }}-${{ matrix.abi }}
          path: dist/*

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - name: Build gopls
        env:
          GOPLS_VERSION: "0.18.1"
        run: |
          mkdir -p dist
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for spec in arm64-v8a:arm64:aarch64-linux-android24-clang: armeabi-v7a:arm:armv7a-linux-androideabi24-clang:GOARM=7 x86_64:amd64:x86_64-linux-android24-clang:; do
            IFS=: read -r abi goarch cc extra <<<"$spec"
            rm -rf "$PWD/gp" && mkdir gp
            env GOOS=android GOARCH="$goarch" $extra CGO_ENABLED=1 CC="$ndk/$cc" GOPATH="$PWD/gp" \
              go install -buildmode=pie -trimpath -ldflags "-s -w" "golang.org/x/tools/gopls@v$GOPLS_VERSION"
            cp "$(find gp/bin -type f | head -1)" "dist/gopls-$GOPLS_VERSION-$abi"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-gopls
          path: dist/*

  clangd:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LLVM_VERSION: "19.1.7"
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;$NDK_VERSION"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - name: Fetch LLVM
        run: git clone --depth 1 --branch "llvmorg-$LLVM_VERSION" https://github.com/llvm/llvm-project.git src
      - name: Build host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          cmake -S src/llvm -B host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_INCLUDE_TESTS=OFF
          ninja -C host llvm-tblgen clang-tblgen clang-tidy-confusable-chars-gen
      - name: Configure for Android
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake -S src/llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android24 \
            -DLLVM_NATIVE_TOOL_DIR="$PWD/host/bin" \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANGD_ENABLE_REMOTE=OFF
      - name: Build clangd
        run: ninja -C build clangd
      - name: Package
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr"
          major="${LLVM_VERSION%%.*}"
          stage=stage
          mkdir -p "$stage/bin" "$stage/lib/clang/$major" "$stage/sysroot" dist
          cp build/bin/clangd "$stage/bin/clangd"
          cp -r "build/lib/clang/$major/include" "$stage/lib/clang/$major/include"
          cp -r "$ndk/include" "$stage/sysroot/include"
          tar -czf "dist/clangd-$LLVM_VERSION-arm64-v8a.tar.gz" -C "$stage" .
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-clangd
          path: dist/*

  publish:
    needs: [rust, go, clangd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: dart-lang/setup-dart@v1
      - name: Build manifest
        run: dart run scripts/make_manifest.dart "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: dist/*
